<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title>Logo Jesus te ama</title>
  <defs>
    <linearGradient id="bg" x1="124" y1="96" x2="900" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2c8af6"/>
      <stop offset="1" stop-color="#1268df"/>
    </linearGradient>
    <linearGradient id="glass" x1="244" y1="164" x2="798" y2="838" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".58"/>
      <stop offset=".52" stop-color="#d7eaff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#76a8ec" stop-opacity=".42"/>
    </linearGradient>
    <linearGradient id="glassInner" x1="294" y1="240" x2="722" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eff7ff" stop-opacity=".72"/>
      <stop offset=".48" stop-color="#bcdcff" stop-opacity=".36"/>
      <stop offset="1" stop-color="#7facf0" stop-opacity=".48"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="30" stdDeviation="34" flood-color="#06469d" flood-opacity=".34"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="176" fill="#eaf5ff"/>
  <rect x="56" y="56" width="912" height="912" rx="150" fill="url(#bg)" filter="url(#shadow)"/>

  <rect x="178" y="170" width="668" height="684" rx="148" fill="url(#glass)" stroke="#dff0ff" stroke-opacity=".58" stroke-width="8"/>
  <rect x="204" y="196" width="616" height="632" rx="128" fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="4"/>
  <rect x="246" y="226" width="532" height="576" rx="126" fill="url(#glassInner)" stroke="#f3fbff" stroke-opacity=".68" stroke-width="6"/>
  <ellipse cx="512" cy="720" rx="260" ry="52" fill="#236bd8" opacity=".16" filter="url(#soft)"/>

  <path d="M318 511c112-96 268-96 388 0-120 96-276 96-388 0Z" fill="none" stroke="#f6fbff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M318 511c112-67 268-67 388 0" fill="none" stroke="#f6fbff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".86"/>
  <path d="M706 511c34-27 67-62 92-104" fill="none" stroke="#f6fbff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M706 511c34 27 67 62 92 104" fill="none" stroke="#f6fbff" stroke-width="19" stroke-linecap="round" stroke-linejoin="round"/>

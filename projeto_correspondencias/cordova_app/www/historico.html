<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Historico de Correspondencias</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="screen">
  <header class="page-header">
    <a class="back-link" href="index.html" aria-label="Voltar">&lsaquo;</a>
    <h1>Historico de Correspondencias</h1>
  </header>

  <main class="page-content">
    <label class="search-field">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
      <input id="search" type="search" placeholder="Pesquisar por data, nome, unidade ou identificacao" autocomplete="off">
    </label>
    <p id="historyMessage" class="history-message" role="status"></p>

    <section id="historyList" class="list history-list" aria-live="polite"></section>
  </main>

  <script src="cordova.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (AppAuth.requireLogin()) {
      var packages = [];
      var list = document.getElementById('historyList');
      var search = document.getElementById('search');
      var message = document.getElementById('historyMessage');
      var cordovaReady = !window.cordova;

      document.addEventListener('deviceready', function () {
        cordovaReady = true;
      }, false);

      function statusLabel(status) {
        return status === 'entregue' ? 'Entregue' : 'Pendente';
      }

      function normalize(value) {
        return String(value || '')
          .toLowerCase()
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '');
      }

      function dateText(value) {
        if (!value) return '';
        var match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!match) return value;

        var year = match[1];
        var month = match[2];
        var day = match[3];

        return [
          value,
          day + '/' + month + '/' + year,
          year + '-' + month + '-' + day,
          AppApi.formatDate(value, true)
        ].join(' ');
      }

      function searchableText(item) {
        return normalize([
          item.unit,
          item.unit_short,
          item.identification,
          item.receiver,
          item.photo ? 'com foto foto correspondencia imagem' : '',
          dateText(item.received_at),
          dateText(item.delivered_at)
        ].join(' '));
      }

      function shareText(item) {
        return [
          'Correspondencia: ' + (item.unit || ''),
          'Identificacao: ' + (item.identification || ''),
          'Recebido em: ' + AppApi.formatDate(item.received_at, true),
          'Retirado por: ' + (item.receiver || ''),
          'Entregue em: ' + AppApi.formatDate(item.delivered_at, true)
        ].join('\n');
      }

      function copyText(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(text);
        }

        var field = document.createElement('textarea');
        field.value = text;
        field.setAttribute('readonly', '');
        field.style.position = 'fixed';
        field.style.top = '-999px';
        document.body.appendChild(field);
        field.select();
        document.execCommand('copy');
        document.body.removeChild(field);
        return Promise.resolve();
      }

      var pdfMeasureContext = null;

      function normalizePdfText(value) {
        return String(value || '')
          .replace(/[\u2018\u2019]/g, "'")
          .replace(/[\u201c\u201d]/g, '"')
          .replace(/[\u2013\u2014]/g, '-');
      }

      function pdfText(value) {
        return normalizePdfText(value)
          .replace(/[\\()]/g, '\\$&')
          .replace(/[\r\n]+/g, ' ');
      }

      function pdfTextWidth(value, sizeFont) {
        var text = String(value || '');

        if (!pdfMeasureContext && typeof document !== 'undefined' && document.createElement) {
          var canvas = document.createElement('canvas');
          pdfMeasureContext = canvas.getContext ? canvas.getContext('2d') : null;
        }

        if (pdfMeasureContext) {
          pdfMeasureContext.font = sizeFont + 'px Helvetica, Arial, sans-serif';
          return pdfMeasureContext.measureText(text).width;
        }

        return text.length * sizeFont * 0.55;
      }

      function splitPdfWord(word, sizeFont, maxWidth) {
        var pieces = [];
        var piece = '';

        for (var i = 0; i < word.length; i += 1) {
          var candidate = piece + word.charAt(i);
          if (piece && pdfTextWidth(candidate, sizeFont) > maxWidth) {
            pieces.push(piece);
            piece = word.charAt(i);
          } else {
            piece = candidate;
          }
        }

        if (piece) {
          pieces.push(piece);
        }

        return pieces.length ? pieces : [''];
      }

      function wrapPdfText(value, sizeFont, maxWidth) {
        var lines = [];
        var paragraphs = normalizePdfText(value).split(/\r\n|\r|\n/);

        paragraphs.forEach(function (paragraph) {
          var trimmed = paragraph.replace(/[ \t]+/g, ' ').trim();
          var words = trimmed ? trimmed.split(' ') : [];
          var current = '';

          if (!words.length) {
            lines.push('');
            return;
          }

          words.forEach(function (word) {
            splitPdfWord(word, sizeFont, maxWidth).forEach(function (part) {
              var next = current ? current + ' ' + part : part;
              if (current && pdfTextWidth(next, sizeFont) > maxWidth) {
                lines.push(current);
                current = part;
                return;
              }

              current = next;
            });
          });

          if (current) {
            lines.push(current);
          }
        });

        return lines.length ? lines : [''];
      }

      function asciiBytes(value) {
        var bytes = [];
        for (var i = 0; i < value.length; i += 1) {
          var code = value.charCodeAt(i);
          bytes.push(code <= 255 ? code : 63);
        }
        return bytes;
      }

      function base64Bytes(base64) {
        var raw = atob(base64);
        var bytes = new Uint8Array(raw.length);
        for (var i = 0; i < raw.length; i += 1) {
          bytes[i] = raw.charCodeAt(i);
        }
        return bytes;
      }

      function jpegData(photo) {
        var match = String(photo || '').match(/^data:image\/jpe?g;base64,(.+)$/i);
        return match ? base64Bytes(match[1]) : null;
      }

      function imageToPdfAsset(src) {
        return new Promise(function (resolve) {
          if (!src) {
            resolve(null);
            return;
          }

          var image = new Image();
          image.onload = function () {
            try {
              var width = image.naturalWidth || image.width;
              var height = image.naturalHeight || image.height;
              var canvas = document.createElement('canvas');
              var context = canvas.getContext('2d');

              canvas.width = width;
              canvas.height = height;
              context.fillStyle = '#ffffff';
              context.fillRect(0, 0, width, height);
              context.drawImage(image, 0, 0, width, height);

              var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
              var match = dataUrl.match(/^data:image\/jpe?g;base64,(.+)$/i);
              resolve(match ? { width: width, height: height, data: base64Bytes(match[1]) } : null);
            } catch (error) {
              resolve(null);
            }
          };
          image.onerror = function () { resolve(null); };
          image.src = src;
        });
      }

      function createPdfFile(filename, pages, images) {
        var pageCount = pages.length;
        var pageObjectStart = 3;
        var fontObject = pageObjectStart + pageCount;
        var contentObjectStart = fontObject + 1;
        var imageObjectStart = contentObjectStart + pageCount;
        var xObjects = images.length ? ' /XObject << ' + images.map(function (asset, index) {
          return '/' + asset.name + ' ' + (imageObjectStart + index) + ' 0 R';
        }).join(' ') + ' >>' : '';
        var kids = pages.map(function (_, index) {
          return (pageObjectStart + index) + ' 0 R';
        }).join(' ');
        var objects = [
          '<< /Type /Catalog /Pages 2 0 R >>',
          '<< /Type /Pages /Kids [' + kids + '] /Count ' + pageCount + ' >>'
        ];

        pages.forEach(function (_, index) {
          objects.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 ' + fontObject + ' 0 R >>' + xObjects + ' >> /Contents ' + (contentObjectStart + index) + ' 0 R >>');
        });

        objects.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');

        pages.forEach(function (pageContent) {
          objects.push('<< /Length ' + asciiBytes(pageContent).length + ' >>\nstream\n' + pageContent + 'endstream');
        });

        images.forEach(function (asset) {
          objects.push({
            header: '<< /Type /XObject /Subtype /Image /Width ' + asset.width + ' /Height ' + asset.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + asset.data.length + ' >>\nstream\n',
            data: asset.data,
            footer: '\nendstream'
          });
        });

        var chunks = [new Uint8Array(asciiBytes('%PDF-1.4\n'))];
        var offsets = [0];
        var length = chunks[0].length;

        objects.forEach(function (object, index) {
          offsets.push(length);
          var start = new Uint8Array(asciiBytes((index + 1) + ' 0 obj\n'));
          chunks.push(start);
          length += start.length;

          if (typeof object === 'string') {
            var body = new Uint8Array(asciiBytes(object + '\nendobj\n'));
            chunks.push(body);
            length += body.length;
            return;
          }

          var header = new Uint8Array(asciiBytes(object.header));
          var footer = new Uint8Array(asciiBytes(object.footer + '\nendobj\n'));
          chunks.push(header, object.data, footer);
          length += header.length + object.data.length + footer.length;
        });

        var xrefOffset = length;
        var xref = 'xref\n0 ' + (objects.length + 1) + '\n0000000000 65535 f \n';
        offsets.slice(1).forEach(function (offset) {
          xref += String(offset).padStart(10, '0') + ' 00000 n \n';
        });
        xref += 'trailer\n<< /Size ' + (objects.length + 1) + ' /Root 1 0 R >>\nstartxref\n' + xrefOffset + '\n%%EOF';

        var end = new Uint8Array(asciiBytes(xref));
        chunks.push(end);
        length += end.length;

        var output = new Uint8Array(length);
        var cursor = 0;
        chunks.forEach(function (chunk) {
          output.set(chunk, cursor);
          cursor += chunk.length;
        });

        return new File([output], filename, {
          type: 'application/pdf'
        });
      }

      function buildPdfFile(item) {
        return Promise.all([
          imageToPdfAsset(item.photo),
          imageToPdfAsset(item.signature)
        ]).then(function (assets) {
          var photoAsset = assets[0];
          var signatureAsset = assets[1];
          var images = [];
          var y = 790;
          var pages = [''];

          if (photoAsset) {
            photoAsset.name = 'Im' + (images.length + 1);
            images.push(photoAsset);
          }

          if (signatureAsset) {
            signatureAsset.name = 'Im' + (images.length + 1);
            images.push(signatureAsset);
          }

          function addContent(value) {
            pages[pages.length - 1] += value;
          }

          function addPage() {
            pages.push('');
            y = 790;
          }

          function ensureSpace(height) {
            if (y - height < 72) {
              addPage();
            }
          }

          function line(text, sizeFont, x, gap, maxWidth) {
            var textX = typeof x === 'number' ? x : 44;
            var width = maxWidth || (595 - textX - 44);
            var lines = wrapPdfText(text, sizeFont, width);
            var lineGap = Math.max(sizeFont + 4, 14);

            lines.forEach(function (textLine, index) {
              ensureSpace(lineGap);
              addContent('BT /F1 ' + sizeFont + ' Tf ' + textX + ' ' + y + ' Td (' + pdfText(textLine) + ') Tj ET\n');
              y -= index === lines.length - 1 ? (gap || 22) : lineGap;
            });
          }

          function estimateLineDrop(text, sizeFont, x, gap, maxWidth) {
            var textX = typeof x === 'number' ? x : 44;
            var width = maxWidth || (595 - textX - 44);
            var lines = wrapPdfText(text, sizeFont, width);
            var lineGap = Math.max(sizeFont + 4, 14);

            return ((lines.length - 1) * lineGap) + (gap || 22);
          }

          function estimateImageHeight(asset, maxWidth, maxHeight) {
            return Math.round(asset.height * Math.min(maxWidth / asset.width, maxHeight / asset.height, 1));
          }

          function drawImage(asset, maxWidth, maxHeight, gapAfter) {
            var ratio = Math.min(maxWidth / asset.width, maxHeight / asset.height, 1);
            var width = Math.round(asset.width * ratio);
            var height = Math.round(asset.height * ratio);

            if (height > y - 72 && y < 790) {
              addPage();
            }

            ratio = Math.min(maxWidth / asset.width, maxHeight / asset.height, Math.max(0, y - 72) / asset.height, 1);
            if (!ratio || ratio <= 0) {
              return;
            }

            width = Math.round(asset.width * ratio);
            height = Math.round(asset.height * ratio);
            y -= height;
            addContent('q ' + width + ' 0 0 ' + height + ' 44 ' + y + ' cm /' + asset.name + ' Do Q\n');
            y -= gapAfter || 28;
          }

          line('Comprovante de Correspondencia', 18, 44, 30);
          line('Unidade: ' + (item.unit || ''), 12, 44);
          line('Identificacao: ' + (item.identification || ''), 12, 44);

          var receivedLine = 'Recebido em: ' + AppApi.formatDate(item.received_at, true);
          var receiverLine = 'Retirado por: ' + (item.receiver || '');
          var deliveredLine = 'Entregue em: ' + AppApi.formatDate(item.delivered_at, true);
          var deliveryBlockHeight = estimateLineDrop(receivedLine, 12, 44) +
            estimateLineDrop(receiverLine, 12, 44) +
            estimateLineDrop(deliveredLine, 12, 44, 30);

          if (photoAsset) {
            deliveryBlockHeight += estimateLineDrop('Foto da correspondencia', 12, 44, 20) +
              estimateImageHeight(photoAsset, 500, 250) + 24;
          }

          if (y - deliveryBlockHeight < 72 && y < 790) {
            addPage();
          }

          line(receivedLine, 12, 44);
          line(receiverLine, 12, 44);
          line(deliveredLine, 12, 44, 30);

          if (photoAsset) {
            if (Math.round(photoAsset.height * Math.min(500 / photoAsset.width, 250 / photoAsset.height, 1)) + 42 > y - 72 && y < 790) {
              addPage();
            }
            line('Foto da correspondencia', 12, 44, 20);
            drawImage(photoAsset, 500, 250, 24);
          }

          if (signatureAsset) {
            if (Math.round(signatureAsset.height * Math.min(320 / signatureAsset.width, 120 / signatureAsset.height, 1)) + 40 > y - 72 && y < 790) {
              addPage();
            }
            line('Assinatura', 12, 44, 18);
            drawImage(signatureAsset, 320, 120, 20);
          }

          pages = pages.map(function (content) {
            return content + 'BT /F1 11 Tf 430 42 Td (Jesus te ama) Tj ET\n';
          });

          return createPdfFile('correspondencia-' + item.id + '.pdf', pages, images);
        });
      }

      function downloadFile(file) {
        var link = document.createElement('a');
        link.href = URL.createObjectURL(file);
        link.download = file.name;
        document.body.appendChild(link);
        link.click();
        setTimeout(function () {
          URL.revokeObjectURL(link.href);
          document.body.removeChild(link);
        }, 1000);
      }

      function fileToBase64(file) {
        return new Promise(function (resolve, reject) {
          var reader = new FileReader();
          reader.onload = function () {
            var result = String(reader.result || '');
            resolve(result.indexOf(',') >= 0 ? result.split(',')[1] : result);
          };
          reader.onerror = function () {
            reject(reader.error || new Error('Nao foi possivel ler o PDF.'));
          };
          reader.readAsDataURL(file);
        });
      }

      function waitForCordovaReady() {
        if (!window.cordova || cordovaReady) {
          return Promise.resolve();
        }

        return new Promise(function (resolve) {
          var resolved = false;
          function done() {
            if (resolved) return;
            resolved = true;
            cordovaReady = true;
            resolve();
          }

          document.addEventListener('deviceready', done, false);
          setTimeout(done, 3000);
        });
      }

      function callNativeShare(options) {
        return new Promise(function (resolve, reject) {
          if (window.NativePdfShare && window.NativePdfShare.sharePdf) {
            window.NativePdfShare.sharePdf(options, function () {
              resolve(true);
            }, reject);
            return;
          }

          if (window.cordova && window.cordova.exec) {
            window.cordova.exec(function () {
              resolve(true);
            }, reject, 'NativePdfShare', 'sharePdf', [options]);
            return;
          }

          resolve(false);
        });
      }

      function nativeErrorMessage(error) {
        if (!error) return 'erro desconhecido';
        if (typeof error === 'string') return error;
        if (error.message) return error.message;
        try {
          return JSON.stringify(error);
        } catch (jsonError) {
          return String(error);
        }
      }

      function nativeSharePdf(file, item, text) {
        return waitForCordovaReady().then(function () {
          return fileToBase64(file);
        }).then(function (base64) {
          return callNativeShare({
              base64: base64,
              filename: file.name,
              title: 'Compartilhar comprovante',
              subject: 'Comprovante de correspondencia ' + (item.unit || ''),
              message: text
          });
        });
      }

      function shareItem(item) {
        var text = shareText(item);
        message.textContent = '';

        return buildPdfFile(item).then(function (file) {
          return nativeSharePdf(file, item, text).then(function (shared) {
            if (shared) {
              message.textContent = 'Escolha para onde enviar o PDF.';
              return;
            }

            return file;
          }).catch(function (error) {
            if (window.cordova) {
              message.textContent = 'Erro ao abrir compartilhamento: ' + nativeErrorMessage(error);
              return null;
            }

            return file;
          });
        }).then(function (file) {
          if (!file) {
            return;
          }

          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            var payload = {
              title: 'Correspondencia ' + (item.unit || ''),
              text: 'Comprovante em PDF',
              files: [file]
            };

            return navigator.share(payload);
          }

          if (navigator.share) {
            return navigator.share({
              title: 'Correspondencia ' + (item.unit || ''),
              text: text
            });
          }

          downloadFile(file);
          message.textContent = 'PDF gerado para compartilhar.';
        }).catch(function (error) {
            if (error && error.name === 'AbortError') {
              return;
            }

            return copyText(text).then(function () {
              message.textContent = 'Dados copiados para compartilhar.';
            });
        });
      }

      function render() {
        var term = normalize(search.value);
        var filtered = packages.filter(function (item) {
          var matchesStatus = item.status === 'entregue';
          var matchesSearch = searchableText(item).indexOf(term) >= 0;
          return matchesStatus && matchesSearch;
        });
        list.innerHTML = filtered.length ? filtered.map(function (item) {
          return '<article class="history-card">' +
            '<div class="history-top"><strong>' + AppApi.escape(item.unit) + '</strong><span class="badge ' + item.status + '">' + statusLabel(item.status) + '</span></div>' +
            '<p>Identificacao: ' + AppApi.escape(item.identification) + '</p>' +
            '<p>Recebido em: ' + AppApi.formatDate(item.received_at, true) + '</p>' +
            (item.photo ? '<img class="history-photo" src="' + AppApi.escape(item.photo) + '" alt="Foto da correspondencia">' : '') +
            '<em>A opcao de excluir ficara disponivel 2 meses apos o recebimento.</em>' +
            '<div class="delivery-info"><p>Retirado por: <strong>' + AppApi.escape(item.receiver || '') + '</strong></p><p>Entregue em: ' + AppApi.formatDate(item.delivered_at, true) + '</p>' + (item.signature ? '<p>Assinatura:</p><img src="' + item.signature + '" alt="Assinatura">' : '') + '</div>' +
            '<div class="history-actions"><button class="share-history" type="button" data-id="' + item.id + '">Compartilhar</button></div>' +
          '</article>';
        }).join('') : '<p class="empty-state">Nenhuma entrega encontrada.</p>';
      }

      list.addEventListener('click', function (event) {
        var button = event.target.closest('.share-history');
        if (!button) return;

        var item = packages.find(function (entry) {
          return String(entry.id) === String(button.dataset.id);
        });

        if (item) {
          message.textContent = 'Gerando PDF...';
          shareItem(item);
        }
      });

      AppApi.listPackages().then(function (items) {
        packages = items;
        render();
      });
      search.addEventListener('input', render);
    }
  </script>
</body>
</html>
